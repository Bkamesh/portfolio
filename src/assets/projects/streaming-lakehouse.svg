<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15131a"/>
      <stop offset="100%" stop-color="#241720"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg3)"/>
  
  <!-- Subtle Grid -->
  <g stroke="#ffffff08" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Title Badge -->
  <text x="60" y="65" fill="#E6526F" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">OPEN TABLE FORMATS &amp; STREAMING</text>
  <text x="60" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Real-Time Streaming Lakehouse (Flink &amp; Paimon)</text>

  <!-- Architecture Flow -->
  <g transform="translate(60, 120)">
    <!-- Node 1: Flink CDC & SQL -->
    <rect x="0" y="0" width="180" height="95" rx="12" fill="#28151c" stroke="#E6526F66" stroke-width="1.5"/>
    <text x="90" y="32" fill="#FFA5B7" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Apache Flink CDC</text>
    <text x="90" y="54" fill="#dfdfdf" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Flink SQL Changelog</text>
    <text x="90" y="75" fill="#E6526F" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">INSERT • UPDATE • DELETE</text>

    <!-- Connector -->
    <path d="M180 48 L235 48" stroke="#E6526F" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Node 2: Apache Paimon -->
    <rect x="245" y="0" width="180" height="95" rx="12" fill="#1f182c" stroke="#A476FF66" stroke-width="1.5"/>
    <text x="335" y="32" fill="#D4BBFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Apache Paimon</text>
    <text x="335" y="54" fill="#dfdfdf" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Streaming Table Storage</text>
    <text x="335" y="75" fill="#A476FF" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">ACID • Primary Key Tables</text>

    <!-- Connector -->
    <path d="M425 48 L480 48" stroke="#A476FF" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Node 3: Trino -->
    <rect x="490" y="0" width="180" height="95" rx="12" fill="#142226" stroke="#00D2BA66" stroke-width="1.5"/>
    <text x="580" y="32" fill="#5BFCE8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Trino Query Engine</text>
    <text x="580" y="54" fill="#dfdfdf" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Low-Latency Ad-hoc SQL</text>
    <text x="580" y="75" fill="#00D2BA" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Sub-minute Changeling View</text>
  </g>

  <!-- Tags at Bottom -->
  <g transform="translate(60, 350)">
    <rect x="0" y="0" width="95" height="28" rx="8" fill="#ffffff10"/>
    <text x="47.5" y="18" fill="#e0e0e0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Apache Flink</text>

    <rect x="105" y="0" width="115" height="28" rx="8" fill="#ffffff10"/>
    <text x="162.5" y="18" fill="#e0e0e0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Apache Paimon</text>

    <rect x="230" y="0" width="65" height="28" rx="8" fill="#ffffff10"/>
    <text x="262.5" y="18" fill="#e0e0e0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Trino</text>

    <rect x="305" y="0" width="105" height="28" rx="8" fill="#ffffff10"/>
    <text x="357.5" y="18" fill="#e0e0e0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Lakehouse PoC</text>

    <rect x="420" y="0" width="70" height="28" rx="8" fill="#ffffff10"/>
    <text x="455" y="18" fill="#e0e0e0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Flink SQL</text>
  </g>
</svg>

